name: voz-libre
# Prueba de voz gratis: Qwen3-TTS (MLX) en una máquina Mac M1 de GitHub (gratis en repo público), contra ElevenLabs a ciegas.
# Se dispara al subir un JSON a jobs/voz-libre/ (formato en tools/voz_prueba_ciega.py). Resultados en out/voz-libre/<id>/.
on:
  push:
    paths: ["jobs/voz-libre/**.json"]
  workflow_dispatch:
    inputs:
      trabajo:
        description: "Ruta del JSON en jobs/voz-libre/"
        required: true
permissions:
  contents: write
concurrency: voz-libre
jobs:
  voz:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v6
      - name: Dependencias
        run: |
          brew install ffmpeg >/dev/null
          uv venv -q --python 3.12 .venv-voz
          VIRTUAL_ENV=.venv-voz uv pip install -q mlx-audio soundfile "faster-whisper>=1.2"
      - name: Voces
        run: |
          J="${{ github.event.inputs.trabajo }}"
          if [ -z "$J" ]; then J=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'jobs/voz-libre/*.json' | tail -1); fi
          echo "trabajo: $J"; test -n "$J"
          if python3 -c "import json,sys; sys.exit(0 if 'voz' in json.load(open(sys.argv[1])) else 1)" "$J"; then
            # voz fija: clon de voz/<nombre>.wav en varios guiones + huella por trozo + pronunciación por guion
            .venv-voz/bin/python tools/voz_fija.py "$J"
            python3 - "$J" <<'PY' > pares.txt
          import json, sys
          j = json.load(open(sys.argv[1]))
          for n, g in j["textos"].items(): print(n, g, "out/voz-libre/" + j["id"])
          PY
            while read N G D; do
              .venv-voz/bin/python tools/voz_comparar.py "$G" "$D" --prefijo "$N"
              .venv-voz/bin/python tools/voz_palabras.py "$D/$N.wav" "$G" "$D/$N.words.json"
            done < pares.txt
          elif python3 -c "import json,sys; sys.exit(0 if 'palabras' in json.load(open(sys.argv[1])) else 1)" "$J"; then
            # subtítulos por palabra con Whisper (y error contra una verdad conocida, si la hay)
            python3 - "$J" <<'PY' > pares.txt
          import json, sys
          for p in json.load(open(sys.argv[1]))["palabras"]:
              print(p["audio"], p["guion"], p["salida"], p.get("modelo", "medium"), p.get("verdad", ""))
          PY
            while read A G S M V; do
              mkdir -p "$(dirname "$S")"
              .venv-voz/bin/python tools/voz_palabras.py "$A" "$G" "$S" --modelo "$M" ${V:+--verdad "$V"}
            done < pares.txt
          else
            # prueba ciega de voces diseñadas contra ElevenLabs
            .venv-voz/bin/python tools/voz_prueba_ciega.py "$J"
            ID=$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['id'])" "$J")
            .venv-voz/bin/python tools/voz_comparar.py "$(python3 -c "import json,sys; print(json.load(open(sys.argv[1]))['guion'])" "$J")" "out/voz-libre/$ID/ciega"
          fi
      - name: Guardar
        if: always()
        run: |
          git config user.name "reels-bot"
          git config user.email "reels-bot@users.noreply.github.com"
          git add out/voz-libre
          git commit -m "voz-libre: resultados" || { echo "nada que guardar"; exit 0; }
          for i in 1 2 3; do git pull --rebase -q origin main && git push && exit 0; sleep 5; done
          exit 1
