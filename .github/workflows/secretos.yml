name: secretos
# Muestra SOLO los nombres de los secretos (nunca sus valores) como aviso del job.
on: workflow_dispatch
jobs:
  nombres:
    runs-on: ubuntu-latest
    steps:
      - env:
          S: ${{ toJSON(secrets) }}
        run: echo "::notice::secretos=$(echo "$S" | jq -r 'keys | join(",")')"
