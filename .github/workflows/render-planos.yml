name: render-planos
# Render por planos (Ep. 2 en adelante): cada pieza de escena/planos_epNN.py arma su escena y renderiza sus cuadros.
# Las piezas se reparten en N trabajos parejos (escena/reparto.py); el armado hace el post, el audio y el MP4 y lo sube a la
# prerelease <epNN>-borrador. Con "muestras" > 0 sólo renderiza n cuadros por pieza y sube una hoja de revisión a <epNN>-muestras.
on:
  workflow_dispatch:
    inputs:
      episodio:
        default: "ep03-edificio-que-camino"
      partes:
        description: "Trabajos en paralelo (el proceso permite hasta 16 máquinas a la vez)"
        default: "15"
      res:
        default: "720x1280"
      samples:
        default: "16"
      muestras:
        description: "Cuadros por pieza (0 = video completo)"
        default: "0"
      piezas:
        description: "Piezas separadas por coma (vacío = todas)"
        default: ""
      base_run:
        description: "Runs anteriores cuyos cuadros se reutilizan, separados por coma, del más viejo al más nuevo (cada uno pisa al anterior y las piezas de este run pisan a todos)"
        default: ""
permissions:
  contents: write
  actions: read
concurrency: render-planos-${{ github.event.inputs.episodio }}-${{ github.event.inputs.muestras }}-${{ github.event.inputs.piezas }}
env:
  EP: ${{ github.event.inputs.episodio }}
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q bpy==5.2.0 numpy pillow
      - id: m
        run: |
          cd "studio/episodios/$EP/escena"
          echo "matrix=$(python reparto.py ${{ github.event.inputs.partes }} '${{ github.event.inputs.piezas }}' ${{ github.event.inputs.muestras }} 2>/dev/null | grep '^{' | tail -1)" >> "$GITHUB_OUTPUT"
          python reparto.py ${{ github.event.inputs.partes }} '${{ github.event.inputs.piezas }}' ${{ github.event.inputs.muestras }} >/dev/null

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -q bpy==5.2.0 numpy scipy pillow
      - name: Animaciones de Mixamo (repo privado, si la escena las pide)
        if: ${{ hashFiles(format('studio/episodios/{0}/escena/assets.txt', github.event.inputs.episodio)) != '' }}
        uses: actions/checkout@v4
        with:
          repository: nadieteexplica/assets
          token: ${{ secrets.TOKEN }}
          path: priv_assets
      - name: Assets de la escena (assets.txt) → $ASSETS
        env:
          GH_TOKEN: ${{ github.token }}
          GH_PRIV: ${{ secrets.TOKEN }}
        run: |
          A="studio/episodios/$EP/escena/assets.txt"
          mkdir -p _assets
          if [ -f "$A" ]; then
            while read -r tipo valor; do
              case "$tipo" in
                modelos) gh release download "$valor" -R "$GITHUB_REPOSITORY" -D _assets -p "*.glb" -p "*.hdr" || true ;;
                privados) GH_TOKEN="$GH_PRIV" gh release download Personajes -R nadieteexplica/assets -p "$valor" -D _assets ;;
                pose) p=$(find priv_assets -iname "$valor" 2>/dev/null | head -1)
                      if [ -z "$p" ]; then GH_TOKEN="$GH_PRIV" gh release download Personajes -R nadieteexplica/assets -p "$valor" -D _assets/poses 2>/dev/null || true; p=$(find _assets/poses -iname "$valor" 2>/dev/null | head -1); fi
                      [ -n "$p" ] && echo "POSE=$GITHUB_WORKSPACE/$p" >> "$GITHUB_ENV" ;;
                gestos) d=$(find priv_assets -type d -iname "$valor" 2>/dev/null | head -1)
                        [ -n "$d" ] && echo "GESTOS=$GITHUB_WORKSPACE/$d" >> "$GITHUB_ENV" && ls "$d" ;;
              esac
            done < "$A"
          fi
          echo "ASSETS=$GITHUB_WORKSPACE/_assets" >> "$GITHUB_ENV"
          ls _assets | head -20
      - name: Render ${{ matrix.piezas }}
        env:
          PIEZAS: ${{ matrix.piezas }}
          RES: ${{ github.event.inputs.res }}
          SAMPLES: ${{ github.event.inputs.samples }}
          MUESTRAS: ${{ github.event.inputs.muestras }}
          DIR: ${{ github.workspace }}/_r
        run: |
          mkdir -p "$DIR"
          cd "studio/episodios/$EP/escena"
          python plano.py 2>&1 | grep -viE "deprecat|use_nodes|Fra:|Saved:" | tail -60
          echo "progreso: $(ls $DIR/*.png 2>/dev/null | wc -l) cuadros, $(ls $DIR/aux/*.png 2>/dev/null | wc -l) auxiliares"
      - uses: actions/upload-artifact@v4
        with:
          name: cuadros-${{ matrix.parte }}
          path: ${{ github.workspace }}/_r
          retention-days: 5

  armar:
    needs: render
    if: ${{ !cancelled() }}      # always() corría el armado igual al cancelar el run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          # apt con tiempo máximo y reintentos (el 23-oct se colgó 20+ min dos veces sin límite)
          for i in 1; do
            timeout 60 sudo apt-get -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::ForceIPv4=true update \
              && timeout 120 sudo apt-get -qq -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::ForceIPv4=true \
                 install -y --no-install-recommends ffmpeg > /dev/null && break
            echo "apt: intento $i falló"
          done
          if ! command -v ffmpeg >/dev/null; then
            # respaldo desde PyPI (imageio-ffmpeg trae un ffmpeg estático; sin ffprobe: el QA se corre aparte)
            pip install -q imageio-ffmpeg
            sudo ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          fi
          ffmpeg -version | head -1
          pip install -q numpy scipy pillow bpy==5.2.0
      - name: Cuadros de los runs base
        if: github.event.inputs.base_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASE: ${{ github.event.inputs.base_run }}
        run: |
          mkdir -p _r
          for id in $(echo "$BASE" | tr ',' ' '); do
            until [ "$(gh run view "$id" --json status -q .status)" = "completed" ]; do echo "esperando run base $id"; sleep 60; done
            gh run download "$id" --pattern 'cuadros-*' --dir "_b_$id"
            for a in _b_$id/*/; do cp -r "$a". _r/; done
            rm -rf "_b_$id"
            echo "base $id: $(ls _r/*.png | wc -l) cuadros, $(ls _r/aux/*.png 2>/dev/null | wc -l) auxiliares"
          done
      - uses: actions/download-artifact@v4
        with:
          pattern: cuadros-*
          path: _r
          merge-multiple: true
      - name: Post
        env:
          OUT: ${{ github.workspace }}/_o
          MUESTRAS: ${{ github.event.inputs.muestras }}
        run: |
          mkdir -p "$OUT"
          cd "studio/episodios/$EP/escena"
          if [ "${{ github.event.inputs.muestras }}" != "0" ]; then
            L=$(ls $GITHUB_WORKSPACE/_r/*.png | xargs -n1 basename | sed 's/\.png//' | sed 's/^0*//' | paste -sd, -)
            LA=$(ls $GITHUB_WORKSPACE/_r/aux/*.png 2>/dev/null | xargs -n1 basename | sed -E 's/^[^_]+_0*([0-9]+)\.png/\1/' | paste -sd, -)
            LISTA="$(echo "$L,$LA" | tr ',' '\n' | grep -v '^$' | sort -n | uniq | paste -sd, -)" python post.py "$GITHUB_WORKSPACE/_r" "$OUT/final"
          else
            python post.py "$GITHUB_WORKSPACE/_r" "$OUT/final"
          fi
      - name: Hoja de muestras
        if: github.event.inputs.muestras != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import glob, os, sys
          sys.path.insert(0, f"studio/episodios/{os.environ['EP']}/escena")
          from PIL import Image, ImageDraw, ImageFont
          import importlib
          E2 = importlib.import_module(os.environ['EP'].split('-')[0])   # epNN.py de la escena del episodio
          fs = sorted(glob.glob("_o/final/*.png"))
          W, H = 216, 384
          cols = 12
          rows = -(-len(fs) // cols)
          hoja = Image.new("RGB", (cols * W, rows * (H + 26)), (16, 20, 24))
          d = ImageDraw.Draw(hoja)
          def plano(f):
              for k in E2.T:
                  a, b = E2.FR(k)
                  if a <= f < b:
                      return k
          for i, f in enumerate(fs):
              n = int(os.path.basename(f)[:5])
              im = Image.open(f).convert("RGB").resize((W, H))
              x, y = (i % cols) * W, (i // cols) * (H + 26)
              hoja.paste(im, (x, y + 26))
              d.text((x + 6, y + 4), f"P{plano(n)} · {n}", fill=(255, 255, 255))
          hoja.save("_o/muestras.jpg", quality=88)
          print(len(fs), "cuadros en la hoja")
          EOF
          TAG="$(echo "$EP" | cut -d- -f1)-muestras"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "$TAG" --notes "Muestras internas. No publicar."
          cd _o/final && zip -q ../muestras_final.zip *.png && cd ../..
          # chequeo automático por plano sobre las muestras (caras tapadas, quemado, vacío, piso plano): lo mira el editor ANTES del auditor
          python tools/auditor/chequeo_planos.py --cuadros _o/final --planos _o/${EP%%-*}_planos.json --meta _r/meta \
            --graficos _o/graficos.json --subs _o/subs_log.json --salida _o/chequeo.json > _o/chequeo.txt || true
          gh release upload "$TAG" _o/muestras.jpg _o/muestras_final.zip _o/chequeo.txt _o/chequeo.json --clobber
      - name: Audio y video
        if: github.event.inputs.muestras == '0'
        env:
          OUT: ${{ github.workspace }}/_o
        run: |
          set -e
          cd "studio/episodios/$EP/escena"
          RENDER="$GITHUB_WORKSPACE/_r" python audio.py
          ffmpeg -y -v error -framerate 30 -i "$OUT/final/%05d.png" -i "$OUT/${EP%%-*}_mix.wav" \
            -vf "scale=1080:1920:flags=lanczos,format=yuv420p" -c:v libx264 -profile:v high -crf 18 -preset slow \
            -c:a aac -b:a 192k -ar 48000 -shortest -movflags +faststart "$OUT/$EP.mp4"
          ffprobe -v error -show_entries format=duration:stream=width,height,r_frame_rate -of compact "$OUT/$EP.mp4" || true
      - name: QA automático
        if: github.event.inputs.muestras == '0'
        continue-on-error: true
        run: python tools/qa.py "_o/$EP.mp4" "_r" "_o/subs_log.json" | tee "_o/qa.txt"
      - name: Chequeo automático por plano
        if: github.event.inputs.muestras == '0'
        continue-on-error: true
        run: |
          python tools/auditor/chequeo_planos.py --video "_o/$EP.mp4" --planos _o/${EP%%-*}_planos.json --meta _r/meta \
            --graficos _o/graficos.json --subs _o/subs_log.json --salida _o/chequeo.json | tee _o/chequeo.txt
          (cd _r && zip -q -r ../_o/meta.zip meta)
      - name: Borrador para revisión (prerelease)
        if: github.event.inputs.muestras == '0'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ffmpeg -y -v error -i "_o/$EP.mp4" -vf "fps=1,scale=216:384,tile=12x7" -frames:v 1 "_o/contacto.jpg" || true
          B="$(echo "$EP" | cut -d- -f1)-borrador"
          gh release view "$B" >/dev/null 2>&1 || gh release create "$B" --prerelease --title "$EP (borrador para revisión)" --notes "Borrador interno para la revisión. No publicar."
          cp _o/${EP%%-*}_planos.json _o/planos.json
          for x in "$EP.mp4" contacto.jpg qa.txt subs_log.json planos.json graficos.json chequeo.json chequeo.txt meta.zip; do
            [ -f "_o/$x" ] || continue
            for i in 1 2 3; do gh release upload "$B" "_o/$x" --clobber && break || { echo "reintento $i: $x"; sleep 15; }; done
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video
          path: _o/*
