name: vista-previa
# Arma un video de avance con los cuadros que YA terminaron en runs de render-planos que siguen corriendo (sin tocarlos).
# Los planos que faltan salen como un cuadro oscuro "PLANO N · TODAVÍA SE RENDERIZA". Sube <ep>-avance.mp4 a <epNN>-borrador.
on:
  workflow_dispatch:
    inputs:
      episodio:
        default: "ep10-kamikazes"
      runs:
        description: "Runs de render-planos, del más viejo al más nuevo (cada uno pisa al anterior)"
        required: true
permissions:
  contents: write
  actions: read
jobs:
  armar:
    runs-on: ubuntu-latest
    env:
      EP: ${{ github.event.inputs.episodio }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: |
          timeout 120 sudo apt-get -qq update && timeout 180 sudo apt-get -qq install -y --no-install-recommends ffmpeg > /dev/null || { pip install -q imageio-ffmpeg; sudo ln -sf "$(python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg; }
          pip install -q numpy scipy pillow bpy==5.2.0
      - name: Cuadros ya terminados
        run: |
          mkdir -p _r
          for id in $(echo "${{ github.event.inputs.runs }}" | tr ',' ' '); do
            gh api "repos/$GH_REPO/actions/runs/$id/artifacts?per_page=100" --jq '.artifacts[] | select(.name|startswith("cuadros")) | "\(.id) \(.name)"' | while read aid nombre; do
              gh api "repos/$GH_REPO/actions/artifacts/$aid/zip" > "_z.zip" && unzip -q -o _z.zip -d _r && rm _z.zip && echo "$id $nombre ok"
            done
          done
          echo "cuadros: $(ls _r/*.png | wc -l)"
      - name: Post, audio y video
        env:
          OUT: ${{ github.workspace }}/_o
          MUESTRAS: "1"
          RELLENO: "1"
        run: |
          mkdir -p "$OUT"
          cd "studio/episodios/$EP/escena"
          python post.py "$GITHUB_WORKSPACE/_r" "$OUT/final"
          python audio.py
          ffmpeg -y -v error -framerate 30 -i "$OUT/final/%05d.png" -i "$OUT/${EP%%-*}_mix.wav" \
            -vf "scale=1080:1920:flags=lanczos,format=yuv420p" -c:v libx264 -crf 20 -preset veryfast \
            -c:a aac -b:a 192k -shortest -movflags +faststart "$OUT/$EP-avance.mp4"
      - name: Subir
        run: |
          B="$(echo "$EP" | cut -d- -f1)-borrador"
          gh release view "$B" >/dev/null 2>&1 || gh release create "$B" --prerelease --title "$EP (borrador para revisión)" --notes "Borrador interno. No publicar."
          gh release upload "$B" "_o/$EP-avance.mp4" --clobber
