name: buscar-objaverse
# Busca modelos en Objaverse 1.0 (modelos de Sketchfab con su licencia en las anotaciones) por palabras y licencia,
# y sube a la prerelease una tabla + una hoja de miniaturas para elegir. No baja los modelos (eso lo hace descargar.yml).
on:
  workflow_dispatch:
    inputs:
      palabras:
        description: "Palabras (en inglés) separadas por coma; se buscan en nombre y tags"
        default: "bird,sparrow,thrasher,finch,robin,cardinal,songbird"
      licencias:
        description: "Licencias aceptadas separadas por coma (by-0 = CC0; by = CC-BY)"
        default: "by-0"
      nombre:
        description: "Prefijo de los archivos de salida"
        default: "aves"
      tag:
        description: "Prerelease destino"
        default: "modelos"
      max:
        description: "Máximo de candidatos en la hoja"
        default: "60"
permissions:
  contents: write
jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q objaverse pillow requests
      - name: Buscar
        env:
          PAL: ${{ github.event.inputs.palabras }}
          LIC: ${{ github.event.inputs.licencias }}
          NOM: ${{ github.event.inputs.nombre }}
          MAX: ${{ github.event.inputs.max }}
        run: |
          python3 - <<'EOF'
          import io, json, os, re
          import objaverse, requests
          from PIL import Image, ImageDraw
          pal = [p.strip().lower() for p in os.environ["PAL"].split(",") if p.strip()]
          lic = {l.strip() for l in os.environ["LIC"].split(",")}
          ann = objaverse.load_annotations()
          rx = re.compile(r"\b(" + "|".join(map(re.escape, pal)) + r")s?\b", re.I)
          res = []
          for uid, a in ann.items():
              if a.get("license") not in lic:
                  continue
              tags = " ".join(t.get("name", "") for t in a.get("tags", []))
              txt = f"{a.get('name','')} {tags}"
              if not rx.search(txt):
                  continue
              th = sorted(a.get("thumbnails", {}).get("images", []), key=lambda i: abs(i.get("width", 0) - 256))
              res.append({"uid": uid, "name": a.get("name"), "license": a.get("license"), "faces": a.get("faceCount"),
                          "anim": a.get("animationCount"), "likes": a.get("likeCount"), "user": a.get("user", {}).get("username"),
                          "url": a.get("viewerUrl"), "tags": tags[:200], "thumb": th[0]["url"] if th else None})
          res.sort(key=lambda r: (-(r["likes"] or 0), -(r["anim"] or 0)))
          print(len(res), "candidatos")
          n = int(os.environ["MAX"])
          os.makedirs("d", exist_ok=True)
          json.dump(res, open(f"d/{os.environ['NOM']}_objaverse.json", "w"), ensure_ascii=False, indent=1)
          tiles = []
          for i, r in enumerate(res[:n]):
              try:
                  im = Image.open(io.BytesIO(requests.get(r["thumb"], timeout=20).content)).convert("RGB").resize((256, 256))
              except Exception:
                  im = Image.new("RGB", (256, 256), (60, 60, 60))
              d = ImageDraw.Draw(im)
              d.rectangle((0, 0, 256, 34), fill=(0, 0, 0))
              d.text((4, 2), f"{i} {(r['name'] or '')[:30]}", fill=(255, 255, 0))
              d.text((4, 18), f"{r['license']} f={r['faces']} a={r['anim']} ♥{r['likes']}", fill=(255, 255, 255))
              tiles.append(im)
          cols = 6
          rows = max(1, -(-len(tiles) // cols))
          sheet = Image.new("RGB", (cols * 256, rows * 256), (20, 20, 20))
          for i, t in enumerate(tiles):
              sheet.paste(t, ((i % cols) * 256, (i // cols) * 256))
          sheet.save(f"d/{os.environ['NOM']}_hoja.jpg", quality=88)
          EOF
      - name: Subir
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "$TAG" --notes "Material para revisar. No publicar."
          gh release upload "$TAG" d/* --clobber
